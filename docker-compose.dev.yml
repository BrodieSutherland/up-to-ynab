services:
  up-to-ynab-dev:
    build:
      context: .
      target: dev
    container_name: up-to-ynab-dev
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    environment:
      - PORT=${PORT:-5001}
      - DEBUG_MODE=true
      - UP_API_TOKEN=${UP_API_TOKEN}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - YNAB_API_TOKEN=${YNAB_API_TOKEN}
      - YNAB_BUDGET_ID=${YNAB_BUDGET_ID}
      - DATABASE_URL=sqlite+aiosqlite:///./data/up_to_ynab.db
    volumes:
      - .:/app

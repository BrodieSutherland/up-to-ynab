name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.14" ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements*.txt

    - name: Install dependencies
      working-directory: .
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run linting
      working-directory: .
      run: |
        # Check code formatting
        black --check --diff .

        # Check import sorting
        isort --check-only --diff .

        # Run flake8 (with some relaxed settings for now)
        flake8 --max-line-length=88 --extend-ignore=E203,W503 .

    - name: Run tests
      working-directory: .
      run: |
        pytest tests/ -v --cov=. --cov-report=term-missing
      env:
        # Mock environment variables for tests
        UP_API_TOKEN: test_token
        YNAB_API_TOKEN: test_token
        YNAB_BUDGET_ID: test_budget
        YNAB_ACCOUNT_ID: test_account

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      working-directory: .
      run: |
        docker build -t up-to-ynab:test .

    - name: Test Docker image
      working-directory: .
      run: |
        docker run -d --name test-container \
          -e UP_API_TOKEN=test -e YNAB_API_TOKEN=test \
          -e YNAB_BUDGET_ID=test -e YNAB_ACCOUNT_ID=test \
          -p 5001:5001 up-to-ynab:test
        if ! curl -fsS --retry 30 --retry-delay 1 --retry-all-errors --max-time 5 \
             http://localhost:5001/health; then
          docker logs test-container
          exit 1
        fi

    - name: Clean up
      if: always()
      run: docker rm -f test-container || true

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  image:
    needs: [test, docker-build, security-scan]
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
    with:
      push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    secrets: inherit

  ci-ok:
    name: CI OK
    if: always()
    needs: [test, docker-build, security-scan, image]
    runs-on: ubuntu-latest
    steps:
    - name: Fail if any required job failed
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1

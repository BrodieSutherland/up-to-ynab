name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: 'pip'
        cache-dependency-path: requirements*.txt

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Check code formatting
      run: black --check --diff .

    - name: Check import sorting
      run: isort --check-only --diff .

    - name: Run flake8
      run: flake8 .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.14" ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements*.txt

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests
      run: pytest -q --cov --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Reads the cache the multi-arch image job writes (default scope) and
    # writes only its own scope, so the two never overwrite each other.
    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        target: runtime
        platforms: linux/amd64
        load: true
        push: false
        tags: up-to-ynab:test
        cache-from: |
          type=gha
          type=gha,scope=smoke
        cache-to: type=gha,scope=smoke,mode=max

    - name: Test Docker image
      run: |
        docker run -d --name test-container \
          -e PORT=8080 \
          -e UP_API_TOKEN=test -e YNAB_API_TOKEN=test \
          -e YNAB_BUDGET_ID=test \
          -p 8080:8080 up-to-ynab:test
        if ! curl -fsS --retry 30 --retry-delay 1 --retry-all-errors --max-time 5 \
             http://localhost:8080/health; then
          docker logs test-container
          exit 1
        fi
        for _ in $(seq 1 30); do
          status=$(docker inspect -f '{{.State.Health.Status}}' test-container)
          [ "$status" = healthy ] && exit 0
          sleep 2
        done
        echo "Container health status is '$status', expected 'healthy'"
        docker logs test-container
        exit 1

    - name: Run Trivy image scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'image'
        image-ref: 'up-to-ynab:test'
        ignore-unfixed: true
        format: 'sarif'
        output: 'trivy-image-results.sarif'

    - name: Upload Trivy image scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-image-results.sarif'
        category: 'trivy-image'

    - name: Clean up
      if: always()
      run: docker rm -f test-container || true

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-fs'

  image:
    needs: [lint, test, docker-build, security-scan]
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
    with:
      push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    secrets: inherit

  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test, docker-build, security-scan, image]
    runs-on: ubuntu-latest
    steps:
    - name: Fail if any required job failed
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1

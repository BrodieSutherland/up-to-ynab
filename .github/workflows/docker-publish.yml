name: Docker Publish

on:
  workflow_call:
    inputs:
      push: { type: boolean, default: false }
      platforms: { type: string, default: "linux/amd64,linux/arm64" }
  workflow_dispatch:
    inputs:
      push: { description: "Push to Docker Hub (main/tags only)", type: boolean, default: false }
      platforms: { type: string, default: "linux/amd64,linux/arm64" }

permissions:
  contents: read

env:
  IMAGE: docker.io/brodiesutherland/up-to-ynab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v7

    - name: Decide whether to push
      id: decide
      env:
        WANT_PUSH: ${{ inputs.push }}
      run: |
        push=false
        if [ "$WANT_PUSH" = "true" ]; then
          case "$GITHUB_REF" in
            refs/tags/v*) push=true ;;
            refs/heads/main)
              tip=$(git ls-remote origin refs/heads/main | cut -f1)
              if [ "$tip" = "$GITHUB_SHA" ]; then push=true
              else echo "::notice::$GITHUB_SHA superseded by $tip; not publishing"; fi ;;
            *) echo "::notice::Not pushing from $GITHUB_REF" ;;
          esac
        fi
        echo "push=$push" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      if: steps.decide.outputs.push == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build (and push)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: ${{ steps.decide.outputs.push == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: ${{ inputs.platforms }}

    - name: Update Docker Hub description
      if: steps.decide.outputs.push == 'true' && github.ref == 'refs/heads/main'
      uses: peter-evans/dockerhub-description@v5
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
        repository: brodiesutherland/up-to-ynab
        short-description: "Sync transactions from Up Bank to YNAB"
        readme-filepath: ./README.md
